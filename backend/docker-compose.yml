# ==============================================================================
# SecAudit / Aura Glass - Standalone Backend Docker Compose (VPS Deployment)
# ==============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: secaudit-backend:latest
    container_name: secaudit-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/data/secaudit.db
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - secaudit-backend-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  secaudit-backend-data:
    driver: local
